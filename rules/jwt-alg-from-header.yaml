rules:
  - id: jwt-alg-from-header
    languages: [python]
    severity: ERROR
    message: >
      JWT verification branches on the algorithm read from the token header,
      which the client controls. This enables algorithm confusion (RS256 to
      HS256). Pin the accepted algorithm in the server, and reject other values
      before checking the signature.
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      references:
        - https://datatracker.ietf.org/doc/html/rfc8725
    patterns:
      - pattern-either:
          - pattern: |
              if $HEADER[...] == "RS256":
                  ...
              elif $HEADER[...] == "HS256":
                  ...
          - pattern: |
              if $HEADER.get(...) == "RS256":
                  ...
              elif $HEADER.get(...) == "HS256":
                  ...
